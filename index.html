<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Başkan Ol</title>
<style>
  @font-face {
    font-family: "PS2P";
    src: url("assets/fonts/PressStart2P.ttf") format("truetype");
    font-display: block;
  }
  :root { color-scheme: dark; }
  html, body {
    box-sizing: border-box;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #1a1c2c;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { width: 100%; height: 100%; }
  #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  .font-preload { position: absolute; left: -999px; font-family: "PS2P"; }
</style>
</head>
<body>
<div id="game"></div>
<span class="font-preload">BAŞKAN</span>
<script src="lib/phaser.min.js"></script>
<script src="src/state.js"></script>
<script src="src/sfx.js"></script>
<script src="src/sprites.js"></script>
<script src="src/ui.js"></script>
<script src="src/scenes/TitleScene.js"></script>
<script src="src/scenes/DayScene.js"></script>
<script src="src/scenes/SummaryScene.js"></script>
<script src="src/main.js"></script>
</body>
</html>
